name: Github Activity

on:
  workflow_dispatch:
  schedule:
    # Runs daily at midnight IST (18:30 UTC).
    - cron: "30 18 * * *"

jobs:
  activity:
    name: Update README with recent activity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3.5.2

      - name: Configure no-change commit guard
        run: |
          chmod +x .github/scripts/git
          echo "REAL_GIT=$(command -v git)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_PATH"

      - name: Add activity to readme
        uses: Readme-Workflows/recent-activity@v2.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}